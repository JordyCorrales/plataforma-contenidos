services:
  # Base de datos relacional
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editorial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial_pass_local}
      POSTGRES_DB: ${POSTGRES_DB:-editorial_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - editorial_network
    # Verificacion de disponibilidad de PostgreSQL
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editorial_user} -d ${POSTGRES_DB:-editorial_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservicio de usuarios y autenticacion
  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: users-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://editorial_user:editorial_pass_local@postgres-db:5432/editorial_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-clave_secreta_desarrollo_local_cambiar_en_prod}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - ./users-service:/app
    networks:
      - editorial_network
    depends_on:
      postgres-db:
        condition: service_healthy

  # Microservicio de publicaciones y flujo editorial
  publications-service:
    build:
      context: ./publications-service
      dockerfile: Dockerfile
    container_name: publications-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://editorial_user:editorial_pass_local@postgres-db:5432/editorial_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-clave_secreta_desarrollo_local_cambiar_en_prod}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    volumes:
      - ./publications-service:/app
    networks:
      - editorial_network
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  # Persistencia de datos
  postgres_data:
    driver: local

networks:
  # Red compartida entre servicios
  editorial_network:
    driver: bridge
