services:
  # Base de datos relacional
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editorial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial_pass_local}
      POSTGRES_DB: ${POSTGRES_DB:-editorial_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - editorial_network
    # Verificacion de disponibilidad de PostgreSQL
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editorial_user} -d ${POSTGRES_DB:-editorial_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Persistencia de datos
  postgres_data:
    driver: local

networks:
  # Red compartida entre servicios
  editorial_network:
    driver: bridge
